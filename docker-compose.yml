# jgit en conteneur.
#
#   jgit ui                                         l'interface, avec les bons montages
#   docker compose run --rm jgit jgit demo list     la ligne de commande
#
# « jgit ui » construit l'image avec ce fichier, puis la lance avec docker run
# et ce que ce fichier ne peut pas décider seul : l'identité de l'hôte (--user),
# le ~/.gitconfig, les known_hosts et l'agent SSH, montés seulement s'ils
# existent (voir ui.sh).
services:
  jgit:
    build: .
    image: j2s/jgit:local
    working_dir: ${PWD}
    volumes:
      # Le dépôt est monté au même chemin que sur l'hôte : les chemins que jgit
      # affiche restent valables des deux côtés.
      - ${PWD}:${PWD}
    environment:
      TERM: ${TERM:-xterm-256color}
